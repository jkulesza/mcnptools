name: CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  # softprops/action-gh-release@v2 does not yet have a Node.js 24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── macOS code signing & notarization ────────────────────────────────────
# Requires the following repository secrets:
#   APPLE_CERTIFICATE             — base64-encoded Developer ID .p12
#                                   Generate with:
#                                     base64 -i DeveloperID.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD    — export password for the .p12
#   APPLE_DEVELOPER_NAME          — name exactly as shown in the certificate
#                                   e.g. "John Doe" or "Organization Name"
#   APPLE_TEAM_ID                 — 10-character Apple Team ID
#   APPLE_ID                      — Apple ID email address
#   APPLE_APP_SPECIFIC_PASSWORD   — app-specific password generated at
#                                   accounts.apple.com, e.g. "1234-abcd-5678-efgh"

jobs:
  # ---------------------------------------------------------------------------
  # Build native executables for each platform
  # TEMPORARY: Disabled for Windows wheel DLL testing
  # ---------------------------------------------------------------------------
  build-executables:
    if: false
    name: Executables / ${{ matrix.os-tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            os-tag: linux-x86_64
          - os: macos-latest
            os-tag: macos-arm64
          - os: macos-latest
            os-tag: macos-x86_64
          - os: windows-latest
            os-tag: windows-x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Get version
        shell: bash
        run: |
          VERSION=$(grep -m1 'project(mcnptools VERSION' CMakeLists.txt \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Install HDF5 (macOS arm64)
        if: matrix.os-tag == 'macos-arm64'
        run: |
          brew install hdf5
          echo "HDF5_ROOT=$(brew --prefix hdf5)" >> $GITHUB_ENV

      - name: Install HDF5 and libtiff (macOS x86_64)
        if: matrix.os-tag == 'macos-x86_64'
        run: |
          arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install hdf5 libtiff
          echo "HDF5_ROOT=/usr/local/opt/hdf5" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/usr/local" >> $GITHUB_ENV

      - name: Install HDF5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:CONDA\Scripts\conda.exe" install -y -c conda-forge hdf5
          $hdf5_root = "$env:CONDA\Library" -replace '\\', '/'
          echo "HDF5_ROOT=$hdf5_root" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -Dmcnptools.python=OFF \
            -DBUILD_TESTING=OFF \
            $([ -n "$HDF5_ROOT" ] && echo "-DHDF5_ROOT=$HDF5_ROOT" || true) \
            $([ -n "$CMAKE_PREFIX_PATH" ] && echo "-DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" || true) \
            $([ "${{ matrix.os-tag }}" = 'macos-x86_64' ] && echo '-DCMAKE_OSX_ARCHITECTURES=x86_64' || true)

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --prefix ${{ github.workspace }}/install --config Release

      - name: Bundle shared libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y patchelf
          INSTALL_DIR="${{ github.workspace }}/install"
          mkdir -p "$INSTALL_DIR/lib"
          for bin in "$INSTALL_DIR/bin/"*; do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            ldd "$bin" | grep '=>' \
              | grep -v -E 'linux-vdso|libpthread|libc\.so|libm\.so|libdl\.so|librt\.so|ld-linux|libstdc\+\+|libgcc_s|libz\.so' \
              | awk '{print $3}' | grep '^/' \
              | xargs -I{} cp -n {} "$INSTALL_DIR/lib/" 2>/dev/null || true
            patchelf --set-rpath '$ORIGIN/../lib' "$bin"
          done

      - name: Bundle DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hdf5_bin = "$env:CONDA\Library\bin"
          $install_bin = "${{ github.workspace }}\install\bin"
          Copy-Item "$hdf5_bin\hdf5*.dll" $install_bin
          Copy-Item "$hdf5_bin\zlib*.dll" $install_bin -ErrorAction SilentlyContinue
          Copy-Item "$hdf5_bin\szip*.dll" $install_bin -ErrorAction SilentlyContinue

      - name: Bundle dylibs (macOS arm64)
        if: matrix.os-tag == 'macos-arm64'
        run: |
          brew install dylibbundler
          INSTALL_DIR="${{ github.workspace }}/install"
          mkdir -p "$INSTALL_DIR/lib"
          for bin in "$INSTALL_DIR/bin/"*; do
            [ -f "$bin" ] && [ -x "$bin" ] && \
              dylibbundler -od -b -x "$bin" -d "$INSTALL_DIR/lib/" \
                -p @executable_path/../lib/ || true
          done

      - name: Bundle dylibs (macOS x86_64)
        if: matrix.os-tag == 'macos-x86_64'
        run: |
          arch -x86_64 /usr/local/bin/brew install dylibbundler
          INSTALL_DIR="${{ github.workspace }}/install"
          mkdir -p "$INSTALL_DIR/lib"
          for bin in "$INSTALL_DIR/bin/"*; do
            [ -f "$bin" ] && [ -x "$bin" ] && \
              arch -x86_64 /usr/local/bin/dylibbundler -od -b -x "$bin" \
                -d "$INSTALL_DIR/lib/" -p @executable_path/../lib/ || true
          done

      - name: Sign macOS binaries and libraries
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_NAME: ${{ secrets.APPLE_DEVELOPER_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Skipping signing: APPLE_CERTIFICATE secret not set."
            exit 0
          fi
          SIGN_IDENTITY="Developer ID Application: $APPLE_DEVELOPER_NAME ($APPLE_TEAM_ID)"
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          INSTALL_DIR="${{ github.workspace }}/install"

          # Sign bundled dylibs first (must be signed before the executables
          # that reference them)
          find "$INSTALL_DIR/lib" -name "*.dylib" 2>/dev/null \
            | while read -r lib; do
                codesign --force --verify --verbose \
                  --sign "$SIGN_IDENTITY" \
                  --options runtime "$lib"
              done

          # Sign executables
          for bin in "$INSTALL_DIR/bin/"*; do
            [ -f "$bin" ] && [ -x "$bin" ] && \
              codesign --force --verify --verbose \
                --sign "$SIGN_IDENTITY" \
                --options runtime "$bin"
          done

          security delete-keychain "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Notarize macOS artifacts
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "Skipping notarization: APPLE_ID secret not set."
            exit 0
          fi
          INSTALL_DIR="${{ github.workspace }}/install"
          NOTARIZE_ZIP=$RUNNER_TEMP/notarize-${{ matrix.os-tag }}.zip
          ditto -c -k --keepParent "$INSTALL_DIR" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id  "$APPLE_TEAM_ID" \
            --wait
          rm -f "$NOTARIZE_ZIP"

      - uses: actions/upload-artifact@v7
        with:
          name: mcnptools-${{ env.VERSION }}-${{ matrix.os-tag }}
          path: install/

  # ---------------------------------------------------------------------------
  # Build Python wheels for each platform × Python version
  # Both macOS architectures build on macos-latest; x86_64 uses a separate
  # x86_64 Homebrew prefix and runs cmake under arch -x86_64 (Rosetta 2).
  # ---------------------------------------------------------------------------
  build-wheels:
    name: Wheel / ${{ matrix.os-tag }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # TEMPORARY: Only building Windows Python 3.14 for DLL bundling testing
        # TEMPORARY: Commented out cross-product. Was:
        #   os: [ubuntu-latest, windows-latest]
        #   python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # TEMPORARY: os-tag for the cross-product entries (commented out)
          # - os: ubuntu-latest
          #   os-tag: linux-x86_64
          # TEMPORARY: Only Python 3.14 for Windows testing
          - os: windows-latest
            python-version: '3.14'
            os-tag: windows-x86_64
          # TEMPORARY: macOS arm64 builds (commented out)
          # - {os: macos-latest, python-version: '3.10', os-tag: macos-arm64}
          # - {os: macos-latest, python-version: '3.11', os-tag: macos-arm64}
          # - {os: macos-latest, python-version: '3.12', os-tag: macos-arm64}
          # - {os: macos-latest, python-version: '3.13', os-tag: macos-arm64}
          # - {os: macos-latest, python-version: '3.14', os-tag: macos-arm64}
          # TEMPORARY: macOS x86_64 builds (commented out)
          # - {os: macos-latest, python-version: '3.10', os-tag: macos-x86_64, cmake-arch: x86_64}
          # - {os: macos-latest, python-version: '3.11', os-tag: macos-x86_64, cmake-arch: x86_64}
          # - {os: macos-latest, python-version: '3.12', os-tag: macos-x86_64, cmake-arch: x86_64}
          # - {os: macos-latest, python-version: '3.13', os-tag: macos-x86_64, cmake-arch: x86_64}
          # - {os: macos-latest, python-version: '3.14', os-tag: macos-x86_64, cmake-arch: x86_64}

    steps:
      - uses: actions/checkout@v6

      - name: Get version
        shell: bash
        run: |
          VERSION=$(grep -m1 'project(mcnptools VERSION' CMakeLists.txt \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Install HDF5 (macOS arm64)
        if: matrix.os-tag == 'macos-arm64'
        run: |
          brew install hdf5
          echo "HDF5_ROOT=$(brew --prefix hdf5)" >> $GITHUB_ENV

      - name: Install HDF5 and libtiff (macOS x86_64)
        if: matrix.os-tag == 'macos-x86_64'
        run: |
          arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install hdf5 libtiff
          echo "HDF5_ROOT=/usr/local/opt/hdf5" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/usr/local" >> $GITHUB_ENV

      - name: Install HDF5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:CONDA\Scripts\conda.exe" install -y -c conda-forge hdf5
          $hdf5_root = "$env:CONDA\Library" -replace '\\', '/'
          echo "HDF5_ROOT=$hdf5_root" >> $env:GITHUB_ENV

      - name: Install Python build tools
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -Dmcnptools.python=ON \
            -DBUILD_TESTING=OFF \
            "-DPython_EXECUTABLE=$(which python)" \
            $([ -n "$HDF5_ROOT" ] && echo "-DHDF5_ROOT=$HDF5_ROOT" || true) \
            $([ -n "$CMAKE_PREFIX_PATH" ] && echo "-DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" || true) \
            $([ "${{ matrix.os-tag }}" = 'macos-x86_64' ] && echo '-DCMAKE_OSX_ARCHITECTURES=x86_64' || true)

      - name: Build Python extension
        run: cmake --build build --config Release --target _mcnptools_wrap

      - name: Sign macOS Python extension
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_NAME: ${{ secrets.APPLE_DEVELOPER_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Skipping signing: APPLE_CERTIFICATE secret not set."
            exit 0
          fi
          SIGN_IDENTITY="Developer ID Application: $APPLE_DEVELOPER_NAME ($APPLE_TEAM_ID)"
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Sign all .so / .dylib files produced by the cmake build so they
          # are signed before being packaged into the wheel.
          find build \( -name "*.so" -o -name "*.dylib" \) 2>/dev/null \
            | while read -r f; do
                codesign --force --verify --verbose \
                  --sign "$SIGN_IDENTITY" \
                  --options runtime "$f"
              done

          security delete-keychain "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build wheel
        working-directory: build/python
        env:
          ARCHFLAGS: ${{ matrix.cmake-arch && format('-arch {0}', matrix.cmake-arch) || '' }}
        run: python setupRelease.py bdist_wheel

      - name: Repair Windows wheel with delvewheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install delvewheel
          $wheel = Get-ChildItem -Path build\python\dist\*.whl | Select-Object -First 1
          delvewheel repair --add-path "$env:CONDA\Library\bin" -w build\python\dist $wheel
          Remove-Item $wheel

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ env.VERSION }}-py${{ matrix.python-version }}-${{ matrix.os-tag }}
          path: build/python/dist/*.whl

  # ---------------------------------------------------------------------------
  # Publish executables and wheels to GitHub Releases on version tags
  # TEMPORARY: Only depends on build-wheels since executables are disabled
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: [build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create archives for executables
        run: |
          # Restore executable bit lost by actions/upload-artifact
          for platform in linux-x86_64 macos-arm64 macos-x86_64; do
            dir="$(ls -d artifacts/mcnptools-*-${platform})"
            [ -d "$dir/bin" ] && chmod +x "$dir/bin/"* || true
          done

          tar -czf mcnptools-${{ env.VERSION }}-linux-x86_64.tar.gz \
            -C "$(ls -d artifacts/mcnptools-*-linux-x86_64)" .
          tar -czf mcnptools-${{ env.VERSION }}-macos-arm64.tar.gz \
            -C "$(ls -d artifacts/mcnptools-*-macos-arm64)" .
          tar -czf mcnptools-${{ env.VERSION }}-macos-x86_64.tar.gz \
            -C "$(ls -d artifacts/mcnptools-*-macos-x86_64)" .
          cd "$(ls -d artifacts/mcnptools-*-windows-x86_64)"
          zip -r ../../mcnptools-${{ env.VERSION }}-windows-x86_64.zip .

      - name: Collect wheels
        run: find artifacts/ -name '*.whl' -exec cp {} . \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mcnptools-${{ env.VERSION }}-linux-x86_64.tar.gz
            mcnptools-${{ env.VERSION }}-macos-arm64.tar.gz
            mcnptools-${{ env.VERSION }}-macos-x86_64.tar.gz
            mcnptools-${{ env.VERSION }}-windows-x86_64.zip
            *.whl
